- name: SG Rules

# User → web_alb → frontend → app_alb → backend → db
  sg:
    - expense-dev-db
    - expense-dev-backend
    - expense-dev-app-alb        # backend ALB
    - expense-dev-frontend
    - expense-dev-web-alb        # frontend ALB
    - expense-dev-bastion
    - expense-dev-vpn

  note: Use either VPN or Bastion (prefer VPN)

  db:
    - name: db_backend
      desc: DB accepts connections from backend
      source: backend
      port: 3306

    - name: db_bastion
      desc: DB accepts connections from bastion
      source: bastion
      port: 3306

    - name: db_vpn
      desc: DB accepts connections from VPN
      source: vpn
      port: 3306

    - name: db_vpn_ssh
      desc: Backend SSH access from VPN
      source: vpn
      port: 22

  backend:
    - name: backend_app_alb
      desc: Backend accepts traffic from app ALB
      source: app_alb
      port: 8080

    - name: backend_bastion_ssh
      desc: Backend SSH access from bastion
      source: bastion
      port: 22

    - name: backend_vpn_ssh
      desc: Backend SSH access from VPN
      source: vpn
      port: 22

    - name: backend_vpn_http
      desc: Backend app access from VPN
      source: vpn
      port: 8080


  app_alb:
    - name: app_alb_vpn
      desc: App ALB accepts traffic from VPN
      source: vpn
      port: 80

    - name: app_alb_frontend
      desc: App ALB accepts traffic from frontend
      source: frontend
      port: 80

    - name: app_alb_bastion
      desc: App ALB accepts traffic from bastion
      source: bastion
      port: 80

  frontend:
    - name: frontend_web_alb
      desc: Frontend accepts traffic from web ALB
      source: web_alb
      port: 80

    - name: frontend_bastion
      desc: Frontend SSH access from bastion
      source: bastion
      port: 22

    - name: frontend_vpn
      desc: Frontend SSH access from VPN
      source: vpn
      port: 22


  web_alb:
    - name: web_alb_public_http
      desc: Web ALB accepts HTTP from public
      source: public   # restrict to your IP/32 ideally
      port: 80

    - name: web_alb_public_https
      desc: Web ALB accepts HTTPS from public
      source: public   # restrict to your IP/32 ideally
      port: 443


  vpn:
    - name: vpn_public
      desc: VPN accepts connections from public
      source: public
      port: 943,443,22,1194


  bastion:
    - name: bastion_public
      desc: Bastion accepts SSH from public
      source: public   # restrict to your IP/32
      port: 22